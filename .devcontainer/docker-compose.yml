services:
  app:
    # Defaults to the stock image, which is what Codespaces uses. A machine
    # behind a TLS-inspecting proxy overrides this in .devcontainer/.env (which
    # is gitignored) with a locally built image carrying the proxy CA roots.
    # Features install at BUILD time, and BuildKit does not inherit the host
    # trust store, so the CA has to be baked into the base image. See E-003.
    image: ${DEVCONTAINER_BASE_IMAGE:-mcr.microsoft.com/devcontainers/typescript-node:22-bookworm}
    volumes:
      # Mounts this repo only, not its parent. A relative source resolves against
      # the directory holding this file, so ".." is the repo root both in a
      # Codespace and on a local machine. The stock devcontainer template uses
      # "../..:/workspaces", which is harmless in a Codespace (the parent holds
      # only this repo) but on a local machine exposes every sibling checkout to
      # the container. The target matches "workspaceFolder" in devcontainer.json.
      # See E-002.
      - ..:/workspaces/centravy:cached
    command: sleep infinity
    # The container always listens on 9000; only the HOST side is variable.
    # A TLS-inspecting proxy may transparently intercept well-known alternate
    # HTTP ports, including 9000, and swallow the response -- the port accepts
    # the connection and then returns nothing, so the browser reports an empty
    # response while the backend is perfectly healthy inside the container.
    # Such a machine sets APP_HOST_PORT in .devcontainer/.env (gitignored).
    # Codespaces has no such file and keeps 9000. See E-004.
    ports:
      - "${APP_HOST_PORT:-9000}:9000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # sslmode=disable is required: Medusa force-enables SSL for any host that
      # isn't localhost/127.0.0.1, and the postgres:16-alpine image has SSL off.
      DATABASE_URL: postgres://centravy:centravy@postgres:5432/centravy?sslmode=disable
      REDIS_URL: redis://redis:6379

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: centravy
      POSTGRES_PASSWORD: centravy
      POSTGRES_DB: centravy
    volumes:
      - centravy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centravy -d centravy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - centravy-redisdata:/data

volumes:
  centravy-pgdata:
  centravy-redisdata:
